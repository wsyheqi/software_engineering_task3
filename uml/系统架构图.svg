<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
  <title id="title">学校来宾酒店预订系统架构图</title>
  <desc id="desc">四类用户通过 Web 界面进入同一个模块化单体后端。接口层和应用层编排接待业务、基础资料与通用支撑十个模块，基础设施层连接统一数据库和学校邮件服务。订单、名额和请求结果同事务，通知提交后发送。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#182640}
      .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}
      .section{font-size:21px;font-weight:700}.name{font-size:19px;font-weight:700}
      .body{font-size:16px;fill:#475569}.small{font-size:14px;fill:#64748b}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1260" fill="#f6f8fc"/>
  <rect x="36" y="32" width="7" height="55" rx="3" fill="#5865d9"/>
  <text x="60" y="60" class="title">学校来宾酒店预订系统</text>
  <text x="60" y="87" class="sub">逻辑架构 · 前后端分离 · 模块化单体 · 同库事务</text>

  <rect x="60" y="116" width="350" height="78" rx="14" fill="#182640"/>
  <text x="82" y="148" style="fill:white;font-size:20px;font-weight:700">四类用户</text>
  <text x="82" y="175" style="fill:#cbd5e1;font-size:15px">来宾 / 接待人员 / 酒店 / 管理员</text>
  <path d="M410 155 H456" class="line"/>
  <rect x="466" y="116" width="914" height="78" rx="14" fill="white" stroke="#ccd5e5"/>
  <text x="490" y="148" class="section">Web 表示层</text>
  <text x="490" y="176" class="body">角色工作区、住宿需求、方案与费用确认、订单履约、统计、本人住宿</text>
  <path d="M924 194 V230" class="line"/>
  <text x="941" y="219" class="small">HTTPS / JSON</text>

  <rect x="36" y="240" width="1368" height="782" rx="22" fill="white" stroke="#b7c4dc" stroke-width="2"/>
  <text x="60" y="273" class="section">后端应用</text>
  <text x="190" y="273" class="sub">十个逻辑模块，共享一个部署单元与一个事务数据库</text>

  <rect x="60" y="294" width="1320" height="66" rx="12" fill="#edf2ff" stroke="#ced8f5"/>
  <text x="84" y="322" class="name">接口层</text>
  <text x="84" y="346" class="body">认证与参数校验 · 角色及对象责任范围 · 字段可见性 · 专用响应 DTO</text>
  <path d="M720 360 V385" class="line"/>
  <rect x="60" y="395" width="1320" height="72" rx="12" fill="#e5eaff" stroke="#b8c5ef"/>
  <text x="84" y="425" class="name">应用层</text>
  <text x="84" y="451" class="body">用例编排 · 稳定请求标识与结果查询 · 全量复核 · 本地事务 · 状态转换入口</text>

  <path d="M720 467 V488 H385 V510" class="line"/>
  <path d="M720 488 H880 V510" class="line"/>
  <path d="M880 488 H1215 V510" class="line"/>

  <rect x="60" y="520" width="650" height="306" rx="14" fill="#f4f7ff" stroke="#cad6f2"/>
  <text x="82" y="553" class="section">接待业务</text>
  <rect x="80" y="574" width="295" height="103" rx="10" fill="white" stroke="#d4ddf2"/>
  <text x="98" y="605" class="name">查询与推荐</text>
  <text x="98" y="632" class="body">住宿需求、逐晚筛选</text>
  <text x="98" y="655" class="body">整单报价、稳定排序、快照</text>
  <rect x="393" y="574" width="295" height="103" rx="10" fill="white" stroke="#d4ddf2"/>
  <text x="411" y="605" class="name">订单管理</text>
  <text x="411" y="632" class="body">九态、初订、改订、取消</text>
  <text x="411" y="655" class="body">价格与规则快照、双批准</text>
  <rect x="80" y="697" width="295" height="103" rx="10" fill="white" stroke="#d4ddf2"/>
  <text x="98" y="728" class="name">入住与退房</text>
  <text x="98" y="755" class="body">逐人到店、实际间夜</text>
  <text x="98" y="778" class="body">续住、提前退房、未入住</text>
  <rect x="393" y="697" width="295" height="103" rx="10" fill="white" stroke="#d4ddf2"/>
  <text x="411" y="728" class="name">异常安置</text>
  <text x="411" y="755" class="body">停业停售、替代方案确认</text>
  <text x="411" y="778" class="body">成功关联新单后关闭原单</text>

  <rect x="730" y="520" width="300" height="306" rx="14" fill="#f0faf6" stroke="#bcdfd0"/>
  <text x="752" y="553" class="section">基础资料</text>
  <rect x="750" y="574" width="260" height="103" rx="10" fill="white" stroke="#c7e4d7"/>
  <text x="768" y="605" class="name">酒店与校方资料</text>
  <text x="768" y="632" class="body">地点距离、审核评价</text>
  <text x="768" y="655" class="body">管理员维护费用规则</text>
  <rect x="750" y="697" width="260" height="103" rx="10" fill="white" stroke="#c7e4d7"/>
  <text x="768" y="728" class="name">房源管理</text>
  <text x="768" y="755" class="body">逐日价格与学校名额</text>
  <text x="768" y="778" class="body">停用、停售、占用释放</text>

  <rect x="1050" y="520" width="330" height="306" rx="14" fill="#f6f2fc" stroke="#d9ccec"/>
  <text x="1072" y="553" class="section">通用支撑</text>
  <rect x="1070" y="574" width="137" height="103" rx="10" fill="white" stroke="#dfd4ee"/>
  <text x="1082" y="608" style="font-size:17px;font-weight:700">身份与权限</text>
  <text x="1082" y="637" class="small">角色、责任范围</text>
  <text x="1082" y="658" class="small">字段访问策略</text>
  <rect x="1223" y="574" width="137" height="103" rx="10" fill="white" stroke="#dfd4ee"/>
  <text x="1235" y="608" style="font-size:17px;font-weight:700">通知与待处理</text>
  <text x="1235" y="637" class="small">站内、学校邮件</text>
  <text x="1235" y="658" class="small">失败跟进、待办</text>
  <rect x="1070" y="697" width="137" height="103" rx="10" fill="white" stroke="#dfd4ee"/>
  <text x="1082" y="731" style="font-size:17px;font-weight:700">统计报表</text>
  <text x="1082" y="760" class="small">三种日期口径</text>
  <text x="1082" y="781" class="small">计划与实际分开</text>
  <rect x="1223" y="697" width="137" height="103" rx="10" fill="white" stroke="#dfd4ee"/>
  <text x="1235" y="731" style="font-size:17px;font-weight:700">操作日志</text>
  <text x="1235" y="760" class="small">关键操作、越权</text>
  <text x="1235" y="781" class="small">按授权范围查询</text>

  <path d="M385 826 V850 H720 V872" class="line"/>
  <path d="M880 826 V850 H720" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M1215 826 V850 H880" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="60" y="882" width="1320" height="84" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="84" y="914" class="name">基础设施层</text>
  <text x="84" y="942" class="body">Repository / 显式 SQL · 持久化任务执行器 · 邮件适配器 · 统一时钟 · 运行配置</text>
  <text x="60" y="1000" class="small">模块写入经所属接口；事务由完整用例编排。</text>

  <path d="M476 966 V1070" class="line"/>
  <text x="495" y="1054" class="small">同一事务提交</text>
  <path d="M1197 966 V1070" class="line"/>
  <text x="1215" y="1054" class="small">业务提交后发送</text>
  <rect x="60" y="1080" width="835" height="102" rx="14" fill="#182640"/>
  <text x="84" y="1116" style="fill:white;font-size:21px;font-weight:700">统一业务数据库 · MySQL / InnoDB</text>
  <text x="84" y="1144" style="fill:#d7e1ef;font-size:16px">订单、全部逐晚占用、请求结果、价格规则快照、履约、任务与审计</text>
  <text x="84" y="1167" style="fill:#aebed6;font-size:14px">整单成功或失败；释放幂等；停业替代确认、原单关闭与释放一致完成</text>
  <rect x="1015" y="1080" width="365" height="102" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="1039" y="1116" class="section">学校邮件服务</text>
  <text x="1039" y="1144" class="body">发送结果落库、失败进入待处理</text>
  <text x="1039" y="1167" class="small">通知失败不撤销已提交业务</text>
  <text x="60" y="1222" class="sub">依据：requirements.md V0.3.3 / 原 UML 组件、类、状态与序列图；详细边界见 architecture.md。</text>
</svg>
