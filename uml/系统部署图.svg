<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">学校来宾酒店预订系统首期部署图</title>
  <desc id="desc">一台四核八 GB 服务器运行 Nginx、模块化单体后端、任务执行器及 MySQL。浏览器通过 HTTPS 访问，任务执行器在提交后联系学校邮件服务。数据库使用持久化目录并另做备份。响应与一小时恢复均为待实测的验收目标。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#182640}
      .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64748b}
      .section{font-size:21px;font-weight:700}.name{font-size:19px;font-weight:700}
      .body{font-size:16px;fill:#475569}.small{font-size:14px;fill:#64748b}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f6f8fc"/>
  <rect x="36" y="32" width="7" height="55" rx="3" fill="#5865d9"/>
  <text x="60" y="60" class="title">学校来宾酒店预订系统</text>
  <text x="60" y="87" class="sub">首期部署 · 单台服务器 · 持久化数据库 · 提交后通知</text>

  <rect x="440" y="124" width="940" height="752" rx="22" fill="white" stroke="#b7c4dc" stroke-width="2"/>
  <text x="480" y="159" class="section">验收服务器：4 核 / 8GB</text>
  <text x="811" y="159" class="small">50 家酒店 / 1 万笔历史订单 / 100 人同时使用</text>

  <rect x="60" y="134" width="300" height="112" rx="14" fill="#182640"/>
  <text x="84" y="170" style="fill:white;font-size:21px;font-weight:700">用户浏览器</text>
  <text x="84" y="198" style="fill:#d7e1ef;font-size:16px">来宾、接待人员、酒店</text>
  <text x="84" y="224" style="fill:#d7e1ef;font-size:16px">平台管理员角色工作区</text>
  <path d="M360 190 H410 V232 H470" class="line"/>
  <text x="63" y="277" class="small">HTTPS / 局域网延迟不超过 20ms</text>

  <rect x="480" y="190" width="860" height="85" rx="12" fill="#edf2ff" stroke="#ced8f5"/>
  <text x="504" y="223" class="section">Nginx · 统一 Web 入口</text>
  <text x="504" y="252" class="body">前端静态资源 / HTTPS / 同域代理 /api</text>
  <path d="M910 275 V315" class="line"/>

  <rect x="480" y="325" width="860" height="200" rx="14" fill="#f4f7ff" stroke="#cad6f2"/>
  <text x="504" y="358" class="section">后端进程 · 一个模块化单体应用</text>
  <rect x="500" y="379" width="490" height="123" rx="10" fill="white" stroke="#d4ddf2"/>
  <text x="520" y="411" class="name">REST 接口与十个逻辑模块</text>
  <text x="520" y="440" class="body">需求推荐、订单、房源、履约、安置</text>
  <text x="520" y="466" class="body">身份权限、校方资料、统计、审计、通知</text>
  <text x="520" y="490" class="small">订单 + 全部占用 + 请求结果：同一数据库事务</text>
  <rect x="1010" y="379" width="310" height="123" rx="10" fill="white" stroke="#d4ddf2"/>
  <text x="1030" y="411" class="name">持久化任务执行器</text>
  <text x="1030" y="440" class="body">请求恢复、到店提醒</text>
  <text x="1030" y="466" class="body">站内通知、邮件与失败重试</text>
  <text x="1030" y="490" class="small">与业务接口同进程，数据库领取任务</text>

  <rect x="60" y="370" width="300" height="120" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="84" y="407" class="section">学校邮件服务</text>
  <text x="84" y="437" class="body">停业通知发送至学校邮箱</text>
  <text x="84" y="466" class="small">失败进入管理员待处理清单</text>
  <path d="M1320 440 H1360 V549 H405 V430 H370" class="line"/>
  <text x="875" y="546" class="small">SMTP：仅发送已提交任务</text>

  <path d="M700 525 V570" class="line"/>
  <path d="M1160 525 V570" class="line"/>
  <rect x="480" y="580" width="860" height="100" rx="14" fill="#182640"/>
  <text x="504" y="615" style="fill:white;font-size:21px;font-weight:700">MySQL / InnoDB · 统一事务数据库</text>
  <text x="504" y="644" style="fill:#d7e1ef;font-size:16px">业务表、请求结果、逐晚占用、实住事实、通知任务及操作审计</text>
  <text x="504" y="667" style="fill:#aebed6;font-size:14px">行锁 + 唯一约束 + 持久化提交；浏览器不直接访问数据库</text>

  <path d="M675 680 V710" class="line"/>
  <rect x="480" y="720" width="390" height="78" rx="12" fill="#f0faf6" stroke="#bcdfd0"/>
  <text x="504" y="751" class="name">持久化数据目录</text>
  <text x="504" y="778" class="body">数据库数据、恢复日志与任务状态</text>
  <rect x="910" y="720" width="430" height="78" rx="12" fill="#f6f2fc" stroke="#d9ccec"/>
  <text x="934" y="751" class="name">系统服务与健康检查</text>
  <text x="934" y="778" class="body">自动拉起后端进程，检查服务可用性</text>
  <text x="480" y="843" class="small">应用重启后按原请求标识恢复处理；终态结果保持不变，通知失败不回滚业务。</text>

  <rect x="60" y="690" width="300" height="108" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="84" y="726" class="section">独立备份存储</text>
  <text x="84" y="754" class="body">定期备份与恢复演练材料</text>
  <text x="84" y="780" class="small">不替代最新已提交事务的持久化</text>
  <path d="M480 630 H410 V744 H370" class="line"/>

  <text x="60" y="926" class="name">验收目标：查询至少 95% ≤ 2 秒；预订至少 95% ≤ 3 秒，均须明确正确结果。</text>
  <text x="60" y="957" class="sub">两类请求各至少 1000 次；普通故障后 1 小时内恢复，确认订单不丢、重试不重复。以上指标尚未实测。</text>
</svg>
