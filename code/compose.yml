services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hospitality
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--innodb-flush-log-at-trx-commit=1", "--sync-binlog=1", "--log-bin=mysql-bin", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u campus --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    build: {context: ., dockerfile: deploy/Dockerfile}
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on: {db: {condition: service_healthy}}
    environment:
      DB_URL: jdbc:mysql://db:3306/hospitality?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_DATA: ${DEMO_DATA:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-campus@example.edu.cn}
    restart: unless-stopped
volumes:
  mysql-data:
